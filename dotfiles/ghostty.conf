# General
# Use `Option` as Meta key on MacOS
macos-option-as-alt = true

# Cursor
shell-integration-features = no-cursor
cursor-style = block
cursor-style-blink = false
# A dim steel colour at full opacity rather than the ecs accent at 0.6, so the cursor looks the
# same as in Rex, which has no cursor opacity
cursor-color = #4f6378
cursor-text = #ffffff

# Font
font-family = "Hack"
font-size = 14

# Draw fonts with a thicker stroke, if supported.
# This is currently only supported on MacOS.
font-thicken = true
font-thicken-strength = 127

# Keybindings
# Assign carriage return to ^m to imitate default Emacs bindings in many terminals
keybind = ctrl+m=text:\r
# The same as above but for ^i
keybind = ctrl+i=text:\t

# Colours
# Near-black and off-white (about 14:1) rather than pure #000000/#ffffff (21:1), to cut glare; the
# background stays darker than the ecs surface #1a1a1a (CursorLine, tmux status)
background = #101010
foreground = #dcdcdc

selection-background = #336699

# Green (SYSTEM)
palette = 1=#cc2222
palette = 2=#69a362

# Collapse each "normal / bright" ANSI pair to a single hex so that bright accents (9/10/11) render
# identically to normal accents (1/2/3). ANSI 11 adopts 'blue-violet'
palette = 9=#cc2222
palette = 10=#69a362
palette = 11=#6e6ec4
