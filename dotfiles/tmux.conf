# vim style navigation in copy mode
set -g mode-keys vi

# Number windows and panes from 1 to follow the keyboard row
set -g base-index 1
setw -g pane-base-index 1

# Do not close gaps when a window is killed
set -g renumber-windows off

set -s set-clipboard external

set -g history-limit 100000

# Forward terminal FocusGained/FocusLost escapes into panes (for Vim autoread, etc.)
set -g focus-events on

# Mouse support: wheel-scroll into copy mode, pane-scoped drag selection,
# click to focus panes/windows, and move/resize for floating panes
# (shift+drag bypasses tmux for native Ghostty selection)
set -g mouse on

# Wheel scrolls 1 line per event instead of the default 5 - the smoothest
# a cell grid allows; raise -N if it feels too slow on a notched wheel
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down

# A plain click dismisses an in-progress keyboard selection, like a
# native terminal
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection

# Setup 'v' to begin selection as in vim
bind -T copy-mode-vi 'v' send -X begin-selection

# 'v' above shadows the stock rectangle-toggle; 'C-v' restores it, as Vim's blockwise visual
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Support for line numbers in copy mode
set -g copy-mode-line-numbers relative

# Copy mode colors, mirroring the ecs.vim colorscheme groups named on each
# line; bg-only styles keep the text colors, like Vim's Visual/Search
set -g copy-mode-selection-style 'bg=#1f3550'                           # Visual
set -g copy-mode-match-style 'bg=#1f3d3d'                               # Search
set -g copy-mode-current-match-style 'fg=#ffffff,bg=#3972a8,bold'       # IncSearch
set -g copy-mode-mark-style 'bg=#3b3563'                                # ref_write tint
set -g copy-mode-position-style 'fg=#ffffff,bg=#3972a8,bold'            # ModeMsg
set -g copy-mode-line-number-style 'fg=#666666'                         # LineNr
set -g copy-mode-current-line-number-style 'fg=#5a93c8,bg=#1a1a1a,bold' # CursorLineNr

# Copy-on-select: every argument-less copy-pipe* below (and the tmux
# defaults, eg. mouse drag and double/triple-click) pipes to copy-command; elsewhere
# set-clipboard sends the selection to the terminal over OSC 52
if '[ "$(uname -s)" = "Darwin" ]' {
    set -s copy-command 'pbcopy'
}

# Setup 'y' to yank (copy), just like vim
bind -T copy-mode-vi 'y' send -X copy-pipe

# Update default binding of `enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe

# Mouse drag and double/triple-click copy through the same copy-command as
# 'y'/Enter, then leave copy mode (the tmux defaults, bound explicitly so a
# config reload overrides any stale binding)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel

# Terminal
# tmux always reports $TERM=tmux-256color to panes; terminal-features tells
# tmux what the real outer terminal (Ghostty) supports so it can generate
# the right capabilities for programs inside (truecolor, undercurl/colored
# underlines for ALE/vim-lsp diagnostics, etc.). A fixed index, unlike
# `-as`, keeps a config reload from appending a duplicate entry each time
set -g default-terminal "tmux-256color"
set -s terminal-features[99] 'xterm-ghostty:RGB:usstyle:hyperlinks'

# Shell
#set-option -g default-shell /bin/zsh

bind '"' split-window -f -c "#{pane_current_path}"
bind % split-window -f -h -c "#{pane_current_path}"

bind _ split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# `Ctrl+b` -> `Ctrl+s`
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# vim-like pane switching & resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h resize-pane -L 1
bind C-l resize-pane -R 1
bind C-j resize-pane -D 2
bind C-k resize-pane -U 2

# Herdr-like resize mode: prefix+r enters, h/j/k/l (and arrows) resize
# repeatedly, H/J/K/L take a coarse step, Escape/Enter/q leave; any other
# key leaves the mode and is handled as a normal key
bind r switch-client -T resize

bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize H resize-pane -L 5 \; switch-client -T resize
bind -T resize L resize-pane -R 5 \; switch-client -T resize
bind -T resize J resize-pane -D 5 \; switch-client -T resize
bind -T resize K resize-pane -U 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 1 \; switch-client -T resize
bind -T resize Right resize-pane -R 1 \; switch-client -T resize
bind -T resize Down resize-pane -D 2 \; switch-client -T resize
bind -T resize Up resize-pane -U 2 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# Explicit pane selection
bind C-p command-prompt -N -1 -p "target pane:" "select-pane -t %1"

# Reload configuration file
bind R source-file ~/.tmux.conf \; display "configuration reloaded"

# Swap panes.
# Swap current pane with destination pane (specified with an integer in a command prompt)
unbind C-o
bind C-o command-prompt -N -1 -p "target pane:" "swap-pane -t %1"

# Synchronize panes on/off
bind g setw synchronize-panes

# Show/hide status line
bind e set status

# Kill the current pane (stock, with confirmation); 'X' kills a pane by number
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X command-prompt -N -1 -p "kill pane:" "kill-pane -t %1"

# Stock window navigation, bound explicitly so a config reload overrides any stale binding
bind n next-window
bind p previous-window

# Explicit window selection by index or name (stock)
bind "'" command-prompt -T window-target -p index { select-window -t ":%%" }

# Show pane numbers (stock); pressing a number while they show selects that pane
bind q display-panes

# Floating panes (tmux >= 3.7). move/resize with the mouse only.

# Spawn a small floating pane for quick actions.
# Previous `bind u` (spawn full-screen pane) binding has been removed as it's possible to enter
# full-screen mode with the C-s z
bind y new-pane -c "#{pane_current_path}" -x '64%' -y '18%' -X '18%' -Y '41%' \
    -s 'bg=#1a1a1a,fg=#ffffff' -S 'fg=#3972a8'

# Refresh the status line every 5 seconds: keeps the cwd segment current and drives
# tmux-continuum's autosave check (0 would disable autosave)
set -g status-interval 5

# Colors
set -g status-bg "#1a1a1a"
set -g status-fg "#ffffff"

# Choose-tree/menu selection, ecs.vim PmenuSel
set -g mode-style 'fg=#ffffff,bg=#263a52,bold'

# Left side of status bar
set -g status-left-length 1000
set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=#1a1a1a#,bg=#3972a8#,bold] RESIZE #[default] ,}#[fg=#3972a8]#S#[fg=default] #[fg=#3972a8]❯ "

# Enable working directory tracking in status line
#set -g update-environment "PWD"

# Right side of status bar
set -g status-right-length 1000
# Nested tmux (eg. this config rsynced to a remote host, used from inside the local tmux): the
# outer tmux sets TERM=tmux-256color in its panes, so an inner client reports that termname.
# The outer tmux swallows `Ctrl+s`, so an inner one also takes `Ctrl+q` as a second prefix
set -g status-right "#{?#{m:tmux*,#{client_termname}},#[fg=black]#H #[fg=red bold]❮ R,#[fg=#3972a8]#{b:pane_current_path}#[fg=#3e3b70]#[fg=#3972a8#,bg=default] ❮ #[fg=#ffffff bold#,bg=#3972a8]#P}"
set-hook -g client-attached \
    "if -F '#{m:tmux*,#{client_termname}}' 'set -g prefix2 C-q' 'set -gu prefix2'"
set-hook -g client-session-changed \
    "if -F '#{m:tmux*,#{client_termname}}' 'set -g prefix2 C-q' 'set -gu prefix2'"
bind C-q send-prefix -2

# Window status
set -g window-status-format "#[fg=#ffffff]#I#[fg=#666666]:#[fg=#3972a8]#W"
set -g window-status-current-format "#[bg=#3972a8,fg=#ffffff bold]#I#[fg=#666666,bg=default]:#[fg=#ffffff bold]#W"

set -g window-status-separator " "

# Window status alignment
set -g status-justify left

set -g pane-border-style "fg=#666666,bg=default"
set -g pane-active-border-style "fg=#3972a8,bg=default"
set -g pane-border-indicators both

# Clock mode
set -g clock-mode-colour white
set -g clock-mode-style 12

# Command mode
set -g message-style 'bg=black,fg=white,fill=black'

# display-panes settings
set -g display-panes-time 1500
set -g display-panes-active-colour "#3972a8" # active border / current window
set -g display-panes-colour "#666666"        # inactive border

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ] || (mkdir -p "$HOME/.tmux/plugins" && git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm")' \
    "run-shell '$HOME/.tmux/plugins/tpm/tpm'"
